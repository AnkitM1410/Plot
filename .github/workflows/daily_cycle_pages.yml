name: Plots & GitHub Pages Deploy

on:
  schedule:
    # Runs daily at 03:00 UTC (08:30 IST)
    - cron: '45 3 * * *'
  workflow_dispatch:

# Permissions needed to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    environment: For_Actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Plots
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python btc_plot_tweet.py

      - name: Prepare GitHub Pages directory
        run: |
          mkdir -p _site
          cp btc_4y_linear.png btc_4y_polar.png index.html _site/

      - name: "Upload Artifacts (Retention: 15 days)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-plots
          path: |
            btc_4y_linear.png
            btc_4y_polar.png
            index.html
          retention-days: 15
          if-no-files-found: ignore

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
